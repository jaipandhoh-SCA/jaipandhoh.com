name: Site uptime check

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:         # "Run workflow" button for a manual check

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check jaipandhoh.com
        id: check
        run: |
          set +e
          bash .github/scripts/check-site.sh | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update alert issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create site-down --color B60205 --description "Automated uptime alert" 2>/dev/null || true
          body=$(printf 'Uptime check failed at %s UTC.\n\n```\n%s\n```\n\n[Run log](%s/%s/actions/runs/%s)' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$(cat report.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --label site-down --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Alert issue #$existing already open; not re-notifying."
          else
            gh issue create --title "🚨 jaipandhoh.com check failing" --label site-down --body "$body"
          fi
          exit 1

      - name: Close alert issue when back up
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label site-down --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "✅ Site checks passing again at $(date -u '+%Y-%m-%d %H:%M') UTC."
          done
